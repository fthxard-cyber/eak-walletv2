
<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08152e">
<title>EAK Wallet</title>
<style>
:root {
  --bg:#08152e;
  --card:#102344;
  --blue:#2563eb;
  --text:#f8fafc;
  --muted:#9aabc5;
  --border:#243b60;
  --green:#34d399;
  --red:#fb7185;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px 16px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.container{max-width:480px;margin:auto}
header{
  display:flex;
  align-items:center;
  gap:12px;
  margin:12px 0 28px;
}
.logo{
  width:45px;height:45px;
  border-radius:14px;
  background:#2563eb;
  display:grid;place-items:center;
  font-weight:bold;font-size:23px;
  color:white;
}
.brand{font-size:20px;font-weight:bold}
.subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
}
.balance-label{
  color:var(--muted);
  font-size:13px;
  letter-spacing:1px;
}
.balance{
  font-size:30px;
  font-weight:bold;
  margin:15px 0 5px;
  overflow-wrap:anywhere;
}
.balance-info{font-size:12px;color:var(--muted)}
.section-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:18px;
}
label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin:14px 0 8px;
}
input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#091a35;
  color:white;
  font-size:16px;
  outline:none;
}
input:focus{border-color:#3b82f6}
button{
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  width:100%;
  background:var(--blue);
  color:white;
  margin-top:18px;
}
.primary:active{opacity:.8}
.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}
.history-item:last-child{border-bottom:0}
.item-name{font-weight:bold;font-size:14px}
.item-date{font-size:11px;color:var(--muted);margin-top:6px}
.item-right{text-align:right}
.item-amount{font-weight:bold;color:var(--green);font-size:14px}
.delete{
  background:#402039;
  color:var(--red);
  padding:7px 10px;
  font-size:11px;
  margin-top:7px;
}
.empty{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:25px 5px;
}
.reset{
  width:100%;
  color:var(--red);
  background:#351d35;
  border:1px solid #63304c;
  margin-top:5px;
}
footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:18px;
}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="logo">E</div>
  <div>
    <div class="brand">EAK WALLET</div>
    <div class="subtitle">Personal Savings</div>
  </div>
</header>

<div class="card">
  <div class="balance-label">TOTAL TABUNGAN</div>
  <div class="balance" id="total">Rp 0</div>
  <div class="balance-info">Seluruh simpanan kamu</div>
</div>

<div class="card">
  <div class="section-title">Tambah Tabungan</div>

  <form id="form">
    <label for="amount">Nominal tabungan (Rp)</label>
    <input
      id="amount"
      type="text"
      inputmode="numeric"
      placeholder="Contoh: 50000"
      required
    >

    <label for="note">Keterangan</label>
    <input
      id="note"
      type="text"
      placeholder="Contoh: Tabungan harian"
      maxlength="60"
    >

    <button class="primary" type="submit">
      + SIMPAN TABUNGAN
    </button>
  </form>
</div>

<div class="card">
  <div class="section-title">Riwayat Tabungan</div>
  <div id="history"></div>
</div>

<button class="reset" onclick="resetSavings()">
  RESET SELURUH TABUNGAN
</button>

<footer>EAK WALLET © 2026</footer>

</div>

<script>
const STORAGE_KEY = "eak_wallet_savings_v1";

let savings = [];

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  savings = saved ? JSON.parse(saved) : [];
  if (!Array.isArray(savings)) savings = [];
} catch(e) {
  savings = [];
}

const amountInput = document.getElementById("amount");

amountInput.addEventListener("input", function(){
  this.value = this.value.replace(/[^0-9]/g,"");
});

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savings));
}

function rupiah(number){
  return "Rp " + String(number);
}

function render(){
  const total = savings.reduce(
    (sum,item) => sum + Number(item.amount), 0
  );

  document.getElementById("total").textContent =
    rupiah(total);

  const history = document.getElementById("history");

  if(savings.length === 0){
    history.innerHTML =
      '<div class="empty">Belum ada tabungan.<br>Yuk mulai menabung!</div>';
    return;
  }

  history.innerHTML = "";

  [...savings].reverse().forEach(item => {
    const row = document.createElement("div");
    row.className = "history-item";

    const left = document.createElement("div");
    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item.note || "Tabungan";

    const date = document.createElement("div");
    date.className = "item-date";
    date.textContent = item.date;

    left.append(name,date);

    const right = document.createElement("div");
    right.className = "item-right";

    const value = document.createElement("div");
    value.className = "item-amount";
    value.textContent = "+" + rupiah(item.amount);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Hapus";
    del.onclick = () => deleteSaving(item.id);

    right.append(value,del);
    row.append(left,right);
    history.append(row);
  });
}

document.getElementById("form").addEventListener(
  "submit", function(e){
    e.preventDefault();

    const amount = Number(amountInput.value);
    const note = document.getElementById("note").value.trim();

    if(!Number.isSafeInteger(amount) || amount <= 0){
      alert("Masukkan nominal tabungan yang benar.");
      return;
    }

    savings.push({
      id: Date.now() + Math.random(),
      amount: amount,
      note: note || "Tabungan",
      date: new Date().toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"long",
        year:"numeric"
      })
    });

    saveData();
    render();

    this.reset();
    alert("Tabungan berhasil disimpan!");
  }
);

function deleteSaving(id){
  if(!confirm("Hapus catatan tabungan ini?")) return;

  savings = savings.filter(item => item.id !== id);
  saveData();
  render();
}

function resetSavings(){
  if(!confirm(
    "Yakin ingin menghapus SELURUH tabungan dan riwayat? Tindakan ini tidak bisa dibatalkan."
  )) return;

  savings = [];
  saveData();
  render();
  alert("Seluruh tabungan berhasil direset.");
}

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("EAK Wallet siap"))
      .catch(error => console.error(error));
  });
}
</script>
</body>
</html>
