<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17191d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>EAK Wallet</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #17191d;
  color: #f4f5f7;
  font-family: Arial, sans-serif;
  padding: 22px 18px 35px;
}

.app {
  max-width: 480px;
  margin: auto;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 30px;
}

.logo {
  width: 43px;
  height: 43px;
  background: #fff;
  color: #17191d;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -1px;
}

.brand {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 1.5px;
}

.subtitle {
  color: #9298a1;
  font-size: 11px;
  margin-top: 4px;
}

h2 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
}

.balance-card {
  background: linear-gradient(145deg, #30343b, #22252a);
  border: 1px solid #42464e;
  border-radius: 20px;
  padding: 23px;
  margin-bottom: 25px;
}

.muted {
  color: #a7adb6;
  font-size: 12px;
}

.balance {
  font-size: 29px;
  font-weight: bold;
  margin: 12px 0 20px;
  overflow-wrap: anywhere;
}

.balance-bottom {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.balance-bottom strong {
  display: block;
  font-size: 13px;
  margin-top: 6px;
}

.section {
  margin-bottom: 27px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action {
  border: 1px solid #393d45;
  background: #22252a;
  border-radius: 15px;
  padding: 17px 12px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.action:active {
  background: #343941;
}

.action span {
  display: block;
  font-size: 22px;
  margin-bottom: 9px;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.summary-card {
  background: #22252a;
  border: 1px solid #393d45;
  padding: 16px;
  border-radius: 15px;
}

.summary-card strong {
  display: block;
  font-size: 15px;
  margin-top: 9px;
  overflow-wrap: anywhere;
}

.income {
  color: #75d6a1;
}

.expense {
  color: #f08c8c;
}

.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.transaction {
  background: #22252a;
  border: 1px solid #393d45;
  border-radius: 14px;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.transaction-name {
  font-size: 14px;
  font-weight: bold;
}

.transaction-date {
  color: #9298a1;
  font-size: 11px;
  margin-top: 6px;
}

.transaction-right {
  text-align: right;
}

.transaction-amount {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.delete {
  background: transparent;
  color: #9298a1;
  border: none;
  font-size: 12px;
  margin-top: 8px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #9298a1;
  padding: 30px 10px;
  font-size: 13px;
}

.filters {
  display: flex;
  gap: 8px;
}

.filter {
  border: 1px solid #393d45;
  color: #a7adb6;
  background: #22252a;
  padding: 7px 13px;
  border-radius: 20px;
  font-size: 11px;
  cursor: pointer;
}

.filter.active {
  color: #17191d;
  background: #f4f5f7;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-box {
  width: 100%;
  max-width: 420px;
  background: #25282e;
  border: 1px solid #444952;
  border-radius: 20px;
  padding: 22px;
}

.modal-box h2 {
  font-size: 18px;
  margin-bottom: 20px;
}

label {
  display: block;
  color: #a7adb6;
  font-size: 12px;
  margin: 14px 0 8px;
}

input {
  width: 100%;
  background: #17191d;
  color: white;
  border: 1px solid #454a53;
  border-radius: 11px;
  padding: 14px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #c5cbd4;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.modal-actions button {
  flex: 1;
  padding: 13px;
  border-radius: 11px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.cancel {
  background: #393d45;
  color: white;
}

.save {
  background: #f4f5f7;
  color: #17191d;
}

/* CUSTOM DELETE MODAL */

.delete-modal {
  z-index: 20;
  background: rgba(0, 0, 0, .78);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.delete-modal-box {
  width: 100%;
  max-width: 420px;
  background: linear-gradient(145deg, #25282e, #1c1e23);
  border: 1px solid #41454d;
  border-radius: 28px;
  padding: 28px 22px 24px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  animation: modalIn .18s ease-out;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.delete-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: #34373d;
  display: grid;
  place-items: center;
  color: #f4e4c7;
}

.delete-icon svg {
  width: 34px;
  height: 34px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.delete-modal-box h2 {
  color: #f4f5f7;
  font-size: 19px;
  margin-bottom: 12px;
}

.delete-message {
  color: #a7adb6;
  font-size: 14px;
  line-height: 1.6;
}

.delete-actions {
  display: flex;
  gap: 12px;
  margin-top: 28px;
}

.delete-actions button {
  flex: 1;
  padding: 15px 10px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.delete-cancel {
  background: #30333a;
  color: #d5d8de;
  border: 1px solid #454952;
}

.delete-confirm {
  background: #f4e4c7;
  color: #49351c;
  border: 1px solid #f4e4c7;
}

.delete-actions button:active {
  transform: scale(.97);
}

footer {
  text-align: center;
  color: #777e88;
  font-size: 10px;
  margin-top: 35px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">EAK</div>
  <div>
    <div class="brand">EAK WALLET</div>
    <div class="subtitle">Personal Finance</div>
  </div>
</header>

<section class="balance-card">
  <div class="muted">TOTAL SALDO</div>
  <div class="balance" id="balance">Rp 0</div>

  <div class="balance-bottom">
    <div>
      <div class="muted">Total Masuk</div>
      <strong class="income" id="totalIncome">Rp 0</strong>
    </div>

    <div>
      <div class="muted">Total Keluar</div>
      <strong class="expense" id="totalExpense">Rp 0</strong>
    </div>
  </div>
</section>

<section class="section">
  <h2>Tambah Transaksi</h2>

  <div class="actions">
    <button class="action" onclick="openForm('in')">
      <span class="income">＋</span>
      Uang Masuk
    </button>

    <button class="action" onclick="openForm('out')">
      <span class="expense">－</span>
      Uang Keluar
    </button>
  </div>
</section>

<section class="section">
  <h2>Ringkasan Bulan Ini</h2>

  <div class="summary">
    <div class="summary-card">
      <div class="muted">Uang Masuk</div>
      <strong class="income" id="monthIncome">Rp 0</strong>
    </div>

    <div class="summary-card">
      <div class="muted">Uang Keluar</div>
      <strong class="expense" id="monthExpense">Rp 0</strong>
    </div>
  </div>
</section>

<section class="section">
  <div class="history-head">
    <h2 style="margin:0">Riwayat Transaksi</h2>
  </div>

  <div class="filters" style="margin-bottom:14px">
    <button class="filter active" data-filter="all">Semua</button>
    <button class="filter" data-filter="in">Masuk</button>
    <button class="filter" data-filter="out">Keluar</button>
  </div>

  <div class="history-list" id="history"></div>
</section>

<footer>EAK WALLET V2 • GRAPHITE SILVER</footer>

</div>

<!-- FORM TRANSAKSI -->

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="formTitle">Tambah Transaksi</h2>

    <label>Nominal (Rp)</label>
    <input id="amount" type="text"
      inputmode="numeric"
      placeholder="Contoh: 150.000">

    <label>Keterangan</label>
    <input id="description" type="text"
      placeholder="Contoh: Uang jajan">

    <label>Tanggal</label>
    <input id="date" type="date">

    <div class="modal-actions">
      <button class="cancel" onclick="closeForm()">Batal</button>
      <button class="save" onclick="saveTransaction()">Simpan</button>
    </div>
  </div>
</div>

<!-- CUSTOM DELETE CONFIRMATION -->

<div class="modal delete-modal" id="deleteModal"
     role="dialog" aria-modal="true"
     aria-labelledby="deleteTitle">

  <div class="delete-modal-box">

    <div class="delete-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18"></path>
        <path d="M8 6V4h8v2"></path>
        <path d="m19 6-1 14H6L5 6"></path>
        <path d="M10 11v5M14 11v5"></path>
      </svg>
    </div>

    <h2 id="deleteTitle">Hapus Riwayat Transaksi?</h2>

    <p class="delete-message">
      Transaksi ini akan dihapus dari riwayat Anda.
    </p>

    <div class="delete-actions">
      <button class="delete-cancel"
        onclick="closeDeleteModal()">
        Batal
      </button>

      <button class="delete-confirm"
        onclick="confirmDelete()">
        Hapus
      </button>
    </div>

  </div>
</div>

<script>
const STORAGE_KEY = "eak_wallet_transactions_v1";

let transactions = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

let currentType = "in";
let currentFilter = "all";
let pendingDeleteId = null;

const rupiah = number =>
  "Rp " + Number(number || 0).toLocaleString("id-ID");

const today = () => {
  const d = new Date();
  const local = new Date(
    d.getTime() - d.getTimezoneOffset() * 60000
  );
  return local.toISOString().slice(0, 10);
};

function saveData() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(transactions)
  );
}

function getTotals(list) {
  let income = 0;
  let expense = 0;

  list.forEach(t => {
    if (t.type === "in") {
      income += Number(t.amount);
    } else {
      expense += Number(t.amount);
    }
  });

  return { income, expense };
}

function render() {
  const totals = getTotals(transactions);

  document.getElementById("balance").textContent =
    rupiah(totals.income - totals.expense);

  document.getElementById("totalIncome").textContent =
    rupiah(totals.income);

  document.getElementById("totalExpense").textContent =
    rupiah(totals.expense);

  const month = today().slice(0, 7);

  const monthly = transactions.filter(t =>
    String(t.date || "").slice(0, 7) === month
  );

  const monthTotals = getTotals(monthly);

  document.getElementById("monthIncome").textContent =
    rupiah(monthTotals.income);

  document.getElementById("monthExpense").textContent =
    rupiah(monthTotals.expense);

  const filtered = [...transactions]
    .filter(t =>
      currentFilter === "all" ||
      t.type === currentFilter
    )
    .sort((a, b) =>
      String(b.date).localeCompare(String(a.date))
    );

  const history = document.getElementById("history");

  if (!filtered.length) {
    history.innerHTML =
      '<div class="empty">Belum ada transaksi</div>';
    return;
  }

  history.innerHTML = filtered.map(t => {
    const isIn = t.type === "in";

    return `
      <div class="transaction">
        <div>
          <div class="transaction-name">
            ${escapeHTML(t.description || "Transaksi")}
          </div>

          <div class="transaction-date">
            ${escapeHTML(t.date || "")}
          </div>
        </div>

        <div class="transaction-right">
          <div class="transaction-amount ${isIn ? "income" : "expense"}">
            ${isIn ? "+" : "-"} ${rupiah(t.amount)}
          </div>

          <button class="delete"
            data-delete="${escapeHTML(String(t.id))}">
            Hapus
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function openForm(type) {
  currentType = type;

  document.getElementById("formTitle").textContent =
    type === "in" ? "Uang Masuk" : "Uang Keluar";

  document.getElementById("amount").value = "";
  document.getElementById("description").value = "";
  document.getElementById("date").value = today();

  document.getElementById("modal").style.display = "flex";
}

function closeForm() {
  document.getElementById("modal").style.display = "none";
}

document.getElementById("amount").addEventListener(
  "input", function() {
    const digits = this.value.replace(/\D/g, "");

    this.value = digits
      ? Number(digits).toLocaleString("id-ID")
      : "";
  }
);

function saveTransaction() {
  const amountText =
    document.getElementById("amount").value;

  const amount = Number(amountText.replace(/\D/g, ""));

  const description =
    document.getElementById("description").value.trim();

  const date = document.getElementById("date").value;

  if (!amount || amount <= 0) {
    alert("Masukkan nominal yang benar.");
    return;
  }

  if (!date) {
    alert("Pilih tanggal transaksi.");
    return;
  }

  transactions.push({
    id: Date.now().toString(),
    type: currentType,
    amount,
    description: description || "Transaksi",
    date
  });

  saveData();
  closeForm();
  render();
}

/* CUSTOM DELETE SYSTEM */

function openDeleteModal(id) {
  pendingDeleteId = String(id);

  document.getElementById("deleteModal")
    .style.display = "flex";
}

function closeDeleteModal() {
  pendingDeleteId = null;

  document.getElementById("deleteModal")
    .style.display = "none";
}

function confirmDelete() {
  if (pendingDeleteId === null) return;

  transactions = transactions.filter(
    t => String(t.id) !== pendingDeleteId
  );

  saveData();
  closeDeleteModal();
  render();
}

document.getElementById("history").addEventListener(
  "click", function(event) {
    const button = event.target.closest("[data-delete]");

    if (!button) return;

    openDeleteModal(button.dataset.delete);
  }
);

// Tutup modal jika mengetuk area gelap
document.getElementById("deleteModal").addEventListener(
  "click", function(event) {
    if (event.target === this) {
      closeDeleteModal();
    }
  }
);

// Tombol Escape untuk membatalkan
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeDeleteModal();
  }
});

/* FILTER TRANSAKSI */

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;

    document.querySelectorAll("[data-filter]")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    render();
  });
});

render();
</script>

</body>
</html>
